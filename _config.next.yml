# NexT theme overrides for DavidChen's Lab
# Only settings that differ from the theme defaults live here.
# NexT merges this file over node_modules/hexo-theme-next/_config.yml,
# so new options added in future theme versions get their defaults automatically.
# Full reference: node_modules/hexo-theme-next/_config.yml

minify: true

custom_file_path:
  head: source/_data/head.njk
  sidebar: source/_data/sidebar.njk
  postBodyEnd: source/_data/post-body-end.njk
  footer: source/_data/footer.njk
  style: source/_data/styles.styl

scheme: Muse
darkmode: true

favicon:
  small: /images/favicon-16x16.png
  medium: /images/favicon-32x32.png
  apple_touch_icon: /images/apple-touch-icon.png
  safari_pinned_tab: /images/safari-pinned-tab.svg
  android_manifest: /images/site.webmanifest

creative_commons:
  license: by-nc-nd
  post: true
  language: deed.zh

menu:
  home: / || fa fa-home
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-th
  archives: /archives/ || fa fa-archive

social:
  E-Mail: mailto:davidchenlab@gmail.com || fa fa-envelope

footer:
  since: 2021
  powered: false

symbols_count_time:
  item_text_post: false

font:
  enable: true
  global:
    family: Lato
    size: 1.4
  title:
    family: Lato
    size: 1.4
  headings:
    family: Lato
    size: 1.4
  posts:
    family: Lato
  codes:
    family: Lato

index_with_subtitle: true
exturl: true

# Image lazyload moved to Hexo's renderer: see `marked.lazyload` in _config.yml

quicklink:
  enable: true
  home: true
  archive: true

disqus:
  enable: true
  shortname: davidchenlab

google_analytics:
  tracking_id: G-ZMM2PZWQSN
  only_pageview: true

local_search:
  enable: true

motion:
  enable: false

pace:
  enable: true
